name: Build Cash Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android/iOS folders & Build Release APK
        working-directory: mobile/cash_app
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create . --platforms=android,ios --project-name cash_app
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/main.dart.bak lib/main.dart
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cash-app-release-apk
          path: mobile/cash_app/build/app/outputs/flutter-apk/app-release.apk
